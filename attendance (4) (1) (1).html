<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Attendance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0D1117; --nav: #0A0E14; --card: #131B26; --card2: #1A2535;
  --border: rgba(255,255,255,0.07);
  --green: #4ADE80; --green-dim: rgba(74,222,128,0.12);
  --red: #F87171; --red-dim: rgba(248,113,113,0.12);
  --gold: #C8B560; --text: #E8EDF5; --muted: #4B5A6E; --muted2: #7A8A9E;
}
body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; max-width: 420px; margin: 0 auto; }

.topnav { background: var(--nav); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.nav-brand { display: flex; align-items: center; gap: 8px; }
.nav-logo { width: 28px; height: 28px; border: 2px solid var(--green); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--green); font-family: 'Share Tech Mono', monospace; }
.nav-name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--gold); text-transform: uppercase; }
.nav-right { display: flex; align-items: center; gap: 8px; }
.live-badge { display: flex; align-items: center; gap: 5px; background: var(--card2); border: 1px solid var(--green); border-radius: 20px; padding: 4px 10px; font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--green); letter-spacing: 1px; }
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.date-box { background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 8px; color: var(--muted2); line-height: 1.5; }
.date-box span { display: block; color: var(--text); font-size: 13px; font-weight: 700; }

.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
.stat-cell { background: var(--bg); padding: 18px 8px; text-align: center; }
.stat-num { font-family: 'Share Tech Mono', monospace; font-size: 40px; line-height: 1; transition: all 0.3s; }
.stat-num.green { color: var(--green); }
.stat-num.gold { color: var(--gold); }
.stat-num.red { color: var(--red); }
.stat-lbl { font-family: 'Share Tech Mono', monospace; font-size: 8px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }

.roster-header { padding: 18px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; }
.roster-title { font-size: 20px; font-weight: 700; }
.roster-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted2); }

.worker-list { padding: 0 16px 120px; display: flex; flex-direction: column; gap: 8px; }

.worker-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--muted); border-radius: 10px; display: flex; align-items: center; padding: 12px 14px; gap: 12px; cursor: pointer; transition: all 0.15s; user-select: none; }
.worker-card:active { transform: scale(0.99); }
.worker-card.present { border-left-color: var(--green); background: linear-gradient(120deg, rgba(74,222,128,0.05) 0%, var(--card) 50%); }
.worker-card.absent { border-left-color: var(--red); background: linear-gradient(120deg, rgba(248,113,113,0.04) 0%, var(--card) 50%); }

.w-avatar { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700; flex-shrink: 0; border: 1px solid; }
.worker-card.present .w-avatar { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,0.3); }
.worker-card.absent .w-avatar { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,0.2); }

.w-info { flex: 1; }
.w-name { font-size: 15px; font-weight: 600; }
.w-role { font-size: 10px; color: var(--muted2); margin-top: 1px; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.5px; }

.w-btn { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1.5px; padding: 5px 10px; border-radius: 5px; border: 1px solid; pointer-events: none; }
.worker-card.present .w-btn { background: var(--green-dim); color: var(--green); border-color: rgba(74,222,128,0.4); }
.worker-card.absent .w-btn { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,0.3); }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 420px; margin: 0 auto; background: var(--nav); border-top: 1px solid var(--border); padding: 12px 16px 24px; }
.submit-btn { width: 100%; padding: 16px; background: transparent; border: 1px solid var(--green); border-radius: 10px; color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
.submit-btn:hover { background: var(--green-dim); }
.submit-btn:active { transform: scale(0.98); }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; align-items: flex-end; justify-content: center; }
.overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid rgba(74,222,128,0.2); border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 420px; animation: up 0.25s cubic-bezier(0.32,0.72,0,1); }
@keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: 2px; color: var(--green); margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted2); margin-bottom: 16px; }
.to-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--card2); border-radius: 8px; margin-bottom: 14px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted2); }
.to-row strong { color: var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--red); border-radius: 5px; padding: 3px 10px; font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; }
.preview-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.preview-tag { font-family: 'Share Tech Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 2px; margin-bottom: 8px; }
.preview-body { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted2); line-height: 1.9; white-space: pre-wrap; }
.result { padding: 10px 14px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 11px; margin-bottom: 14px; display: none; }
.result.show { display: block; }
.result.ok { background: var(--green-dim); border: 1px solid rgba(74,222,128,0.3); color: var(--green); }
.result.fail { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
.modal-btns { display: flex; gap: 10px; }
.btn-cancel { flex: 1; padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted2); font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-send { flex: 2; padding: 14px; background: transparent; border: 1px solid var(--green); border-radius: 8px; color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; }
.btn-send:hover { background: var(--green-dim); }
.btn-send:disabled { border-color: var(--muted); color: var(--muted); cursor: not-allowed; }
.spinner { width: 13px; height: 13px; border: 2px solid var(--muted); border-top-color: var(--green); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div class="topnav">
  <div class="nav-brand">
    <div class="nav-logo">AR</div>
    <div class="nav-name">Ahmed Raza Art</div>
  </div>
  <div class="nav-right">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <div class="date-box" id="dateBox">—</div>
  </div>
</div>

<div class="stats-row">
  <div class="stat-cell"><div class="stat-num green" id="cPresent">00</div><div class="stat-lbl">PRESENT</div></div>
  <div class="stat-cell"><div class="stat-num gold">13</div><div class="stat-lbl">TOTAL</div></div>
  <div class="stat-cell"><div class="stat-num red" id="cAbsent">13</div><div class="stat-lbl">ABSENT</div></div>
</div>

<div class="roster-header">
  <div class="roster-title">Crew Roster</div>
  <div class="roster-sub">13 Workers</div>
</div>

<div class="worker-list" id="workerList"></div>

<div class="bottom-bar">
  <button class="submit-btn" onclick="openModal()">&#9658; SUBMIT &amp; SEND MESSAGE</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">CONFIRM ATTENDANCE</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="to-row">&#128235; Telegram: <strong>@attendancetickbot</strong></div>
    <div class="chips" id="chips"></div>
    <div class="preview-box">
      <div class="preview-tag">MESSAGE PREVIEW</div>
      <div class="preview-body" id="previewBody"></div>
    </div>
    <div class="result" id="resultMsg"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">BHEJO</button>
    </div>
  </div>
</div>

<script>
  var TOKEN = "8430017634:AAGKyNcFKocjkv_3zPnl2GXcjQUbgy97qkA";
  var CHAT_ID = "8097331565";
  var WORKERS = ["Suresh","Akil","Amir","Mannan","Sakir","Sonu","Mohammad","Sharuk","Ramdin","Akber","Jahangir","Nona","Yusuf"];
  var ROLES = ["Painter","Mason","Mason","Supervisor","Helper","Helper","Painter","Helper","Carpenter","Mason","Painter","Helper","Electrician"];

  var state = {};
  WORKERS.forEach(function(w){ state[w] = false; });

  var now = new Date();
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  document.getElementById("dateBox").innerHTML = MONTHS[now.getMonth()] + " " + now.getFullYear() + "<br><span>" + now.getDate() + "</span>";

  function pad(n){ return n < 10 ? "0"+n : ""+n; }

  function render(){
    var list = document.getElementById("workerList");
    list.innerHTML = "";
    WORKERS.forEach(function(name, i){
      var p = state[name];
      var d = document.createElement("div");
      d.className = "worker-card " + (p ? "present" : "absent");
      d.onclick = function(){ toggle(name); };
      d.innerHTML =
        '<div class="w-avatar">' + name.slice(0,2).toUpperCase() + '</div>' +
        '<div class="w-info"><div class="w-name">' + name + '</div><div class="w-role">' + ROLES[i] + '</div></div>' +
        '<div class="w-btn">' + (p ? "PRESENT" : "ABSENT") + '</div>';
      list.appendChild(d);
    });
    updateStats();
  }

  function toggle(name){ state[name] = !state[name]; render(); }

  function updateStats(){
    var p = WORKERS.filter(function(w){ return state[w]; }).length;
    document.getElementById("cPresent").textContent = pad(p);
    document.getElementById("cAbsent").textContent = pad(WORKERS.length - p);
  }

  function getAbsent(){ return WORKERS.filter(function(w){ return !state[w]; }); }
  function getPresent(){ return WORKERS.filter(function(w){ return state[w]; }); }

  function buildMsg(){
    var absent = getAbsent(), present = getPresent();
    var d = now.getDate() + "/" + (now.getMonth()+1) + "/" + now.getFullYear();
    if(absent.length === 0) return "Ahmed Raza Art Decorators\nDate: " + d + "\nSab workers present hain\nTotal: " + WORKERS.length + "/" + WORKERS.length;
    return "Ahmed Raza Art Decorators\nDate: " + d + "\nAbsent (" + absent.length + "): " + absent.join(", ") + "\nPresent: " + present.length + "/" + WORKERS.length;
  }

  function openModal(){
    var absent = getAbsent();
    document.getElementById("modalSub").textContent = absent.length === 0 ? "Sab " + WORKERS.length + " workers present hain." : absent.length + " worker" + (absent.length > 1 ? "s" : "") + " absent hain.";
    var chips = document.getElementById("chips");
    chips.innerHTML = absent.length === 0
      ? '<span style="font-size:11px;color:#4ADE80;font-family:Share Tech Mono,monospace;letter-spacing:1px">ALL PRESENT</span>'
      : absent.map(function(n){ return '<div class="chip">' + n.toUpperCase() + '</div>'; }).join("");
    document.getElementById("previewBody").textContent = buildMsg();
    document.getElementById("resultMsg").className = "result";
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("sendBtn").textContent = "BHEJO";
    document.getElementById("overlay").classList.add("show");
  }

  function closeModal(){ document.getElementById("overlay").classList.remove("show"); }

  async function sendMessage(){
    var sendBtn = document.getElementById("sendBtn");
    var resultMsg = document.getElementById("resultMsg");
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<div class="spinner"></div> BHEJ RAHA HOON...';
    resultMsg.className = "result";
    try {
      var res = await fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: CHAT_ID, text: buildMsg()})
      });
      var data = await res.json();
      if(!data.ok) throw new Error();
      resultMsg.className = "result show ok";
      resultMsg.textContent = "MESSAGE SENT — Telegram pe dekho.";
      sendBtn.textContent = "SENT";
    } catch(e){
      resultMsg.className = "result show fail";
      resultMsg.textContent = "NAHI GAYA — Internet check karo.";
      sendBtn.disabled = false;
      sendBtn.textContent = "RETRY";
    }
  }

  render();
</script>
</body>
</html>
